                <h1>雾霾没有假日</h1>
                <div class="meta"><span class="meta-date">2024-01-01</span><a class="source-link" href="https://yinwang1.substack.com/p/44f" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!QL2o!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3c66121a-a7b8-4661-a1df-c6a74572180e_2388x1668.png" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!QL2o!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3c66121a-a7b8-4661-a1df-c6a74572180e_2388x1668.png 424w, https://substackcdn.com/image/fetch/$s_!QL2o!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3c66121a-a7b8-4661-a1df-c6a74572180e_2388x1668.png 848w, https://substackcdn.com/image/fetch/$s_!QL2o!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3c66121a-a7b8-4661-a1df-c6a74572180e_2388x1668.png 1272w, https://substackcdn.com/image/fetch/$s_!QL2o!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3c66121a-a7b8-4661-a1df-c6a74572180e_2388x1668.png 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/3c66121a-a7b8-4661-a1df-c6a74572180e_2388x1668.png","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":1017,"width":1456,"resizeWidth":null,"bytes":8042124,"alt":null,"title":null,"type":"image/png","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="1017" src="../../assets/posts/44f/3917389a19fdc8c3.png" width="1456"/></source></picture></div></a></figure></div><p>新年好？新年快乐？但雾霾是没有节假日的。难道有这么多工人元旦不放假，在烟囱旁边拼命工作？显然不是的，因为雾霾并不是工厂释放的污染物，而是在故意放毒。节假日大家都出门玩，当然更要放毒。<br/><br/>本来“新年”第一天好像不应该说这些，但哪里还有什么新的一年。人类的荒诞故事只是一天天地在继续而已，“新年”当然并不会是新的一天，不会突然比 12 月 31 日更美好。只有人类意识到这世界在发生什么，我们才可能迎来真正的解放和“新年”。</p><p></p></article>
