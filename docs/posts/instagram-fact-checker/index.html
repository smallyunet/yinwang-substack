                <article class="post"><p>好久没用 Instagram。昨天打开刷了一下，发现一个朋友发的照片被标记为“False information”。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!-Lx4!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8e4ecd09-17b9-4fb7-9486-f304e5575e83_1125x1800.png" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!-Lx4!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8e4ecd09-17b9-4fb7-9486-f304e5575e83_1125x1800.png 424w, https://substackcdn.com/image/fetch/$s_!-Lx4!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8e4ecd09-17b9-4fb7-9486-f304e5575e83_1125x1800.png 848w, https://substackcdn.com/image/fetch/$s_!-Lx4!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8e4ecd09-17b9-4fb7-9486-f304e5575e83_1125x1800.png 1272w, https://substackcdn.com/image/fetch/$s_!-Lx4!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8e4ecd09-17b9-4fb7-9486-f304e5575e83_1125x1800.png 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/8e4ecd09-17b9-4fb7-9486-f304e5575e83_1125x1800.png","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":1800,"width":1125,"resizeWidth":385,"bytes":437276,"alt":null,"title":null,"type":"image/png","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="616" src="../../assets/posts/instagram-fact-checker/600ad463fa60e90f.png" width="385"/></source></picture></div></a></figure></div><p>我有点惊讶，还以为她发了什么阴谋论信息。结果点开这帖子，看到一句“林肯名言”：<strong>预测未来的最好方法是创造未来。"The best way to predict the future is to create it." - Abraham Lincoln</strong></p></article>
