                <h1>认清真相并不可怕</h1>
                <div class="meta"><span class="meta-date">2023-02-18</span><a class="source-link" href="https://yinwang1.substack.com/p/925" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>有朋友听我说 Matrix 的各种骗局，说觉得很压抑，感觉世界都变了样，不再美好。我问她，难道你曾经认识的那个世界是美好的？如果现在给你两种选择：</p><p>1. 政府是诚实的，所有那些可怕的事情都是真的：核武器，病毒，战争……</p><p>2. 政府一直在撒谎，这些可怕的事情都是假的。</p><p>你选择哪一个？她说：“当然是 2。”</p><p>我觉得稍微聪明的人都会选择 2。虽然政府一直在撒谎，制造了一出出的戏，但我们知道地球是安全的，政府是纸老虎。只要突破 Matrix 在我们头脑里设置的那些枷锁，我们就能获得自由。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!nb_u!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff63cd135-bf63-44fc-bcfa-65a25d0b75a9_475x286.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!nb_u!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff63cd135-bf63-44fc-bcfa-65a25d0b75a9_475x286.jpeg 424w, https://substackcdn.com/image/fetch/$s_!nb_u!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff63cd135-bf63-44fc-bcfa-65a25d0b75a9_475x286.jpeg 848w, https://substackcdn.com/image/fetch/$s_!nb_u!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff63cd135-bf63-44fc-bcfa-65a25d0b75a9_475x286.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!nb_u!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff63cd135-bf63-44fc-bcfa-65a25d0b75a9_475x286.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/f63cd135-bf63-44fc-bcfa-65a25d0b75a9_475x286.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":286,"width":475,"resizeWidth":null,"bytes":69118,"alt":null,"title":null,"type":"image/jpeg","href":null,"be
