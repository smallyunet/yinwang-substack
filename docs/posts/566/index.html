                <h1>《王垠全集》</h1>
                <div class="meta"><span class="meta-date">2023-08-03</span><a class="source-link" href="https://yinwang1.substack.com/p/566" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>花了一些时间，把微博的帖子一篇篇地往 substack 搬。浏览着这几个月写出的文字，它们让我欣慰。有时候回去看自己写的东西，有一种“原来我是这样的人”，死而无憾了的感觉。</p><p>这些文字的价值，比起我在编程语言领域的造诣大了非常多。编程语言永远只能操作机器，而人类语言可以改变人的思想，改变世界。</p><p>我应该把写过的所有文字整理出来编成一本书，叫做《王垠全集》。也许经过一百年，很多人看这本书会记得我——有一个人真的改变了世界，人类终于获得了自由。</p><p>不过我这样一篇篇地整理有点累了，我欢迎志愿者参加帮忙。</p></article>
