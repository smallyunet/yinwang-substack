                <h1>脚气复发的原因</h1>
                <div class="meta"><span class="meta-date">2023-11-12</span><span class="tag tag-paid">PAID</span><a class="source-link" href="https://yinwang1.substack.com/p/112" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>经过这一番折腾，我发现很多人的脚气治了会反复的重要原因，很可能是因为鞋袜消毒的方法并不正确。很多人都忽视袜子的消毒，以为放进洗衣机洗了就好了，其实不是。袜子必须严格消毒，跟鞋一样的方式。我最新的建议是把袜子整体泡在双氧水里消毒。</p><p>另外，很多给鞋消毒的喷雾，也许其实是无效的。比如我之前买的 Dr Scholl 喷雾，说每次只需对鞋里面喷 2-3 下就行，能杀死 99.9% 的真菌（如图）。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!VxyB!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcdb75e96-117c-487a-af04-6de8119f81e3_480x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!VxyB!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcdb75e96-117c-487a-af04-6de8119f81e3_480x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!VxyB!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcdb75e96-117c-487a-af04-6de8119f81e3_480x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!VxyB!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcdb75e96-117c-487a-af04-6de8119f81e3_480x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!VxyB!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcdb75e96-117c-487a-af04-6de8119f81e3_480x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/cdb75e96-117c-487a-af04-6de8119f81e3_480x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":480,"resizeWidth":null,"bytes":65168,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProc
