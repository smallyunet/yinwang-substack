                <h1>“～”</h1>
                <div class="meta"><span class="meta-date">2020-06-02</span><a class="source-link" href="https://yinwang1.substack.com/p/20-06-02" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>有人看了我的上一条微博，对我说“突然发现 ～ 这个符号有点轻佻的感觉，弃用。” 其实我早就想说这个事。每次看到有人跟我打招呼后面加一个或者两个 ~，都会觉得有点怪。有些人以前从来不用这个，忽然有一天开始用这个，我就觉得被感染了什么病毒。</p><p>英语世界也有这种现象。搜索了一下，发现已经有人讨论了这个事情。另外一些人的回答似乎“跑题”了，但指出了 ~ 这个符号的正确用法应该是在什么地方。</p><a class="image-link image2" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!k8oZ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5367b96-a3f9-4e53-bd02-7126f651f01c_1024x850.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!k8oZ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5367b96-a3f9-4e53-bd02-7126f651f01c_1024x850.jpeg 424w, https://substackcdn.com/image/fetch/$s_!k8oZ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5367b96-a3f9-4e53-bd02-7126f651f01c_1024x850.jpeg 848w, https://substackcdn.com/image/fetch/$s_!k8oZ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5367b96-a3f9-4e53-bd02-7126f651f01c_1024x850.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!k8oZ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5367b96-a3f9-4e53-bd02-7126f651f01c_1024x850.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://bucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com/public/images/e5367b96-a3f9-4e53-bd02-7126f651f01c_1024x850.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":null,"width":null,"resizeWidth":null,"bytes":null,"alt":null,"title":nul
