                <h1>中招是因为病毒？</h1>
                <div class="meta"><span class="meta-date">2022-12-14</span><a class="source-link" href="https://yinwang1.substack.com/p/650" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>
听说北京很多人“中招”了。我看了一下空气质量历史记录，发现 12 月 12 日，北京空气 pm2.5 和 pm10 的浓度极高。pm2.5 超过了 160，pm10 超过了 1000！前所未见的高度，柱状图都爆表了，只看到一条条的黑线。而且从幅度上看，是在短时间内急剧上升的。很多人担心病毒“传染”，却没注意到空气里的有毒物质可能才是“共同起因”。我的建议是：出门戴上 N95 口罩，在家密封好门窗。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!X5EU!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!X5EU!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 424w, https://substackcdn.com/image/fetch/$s_!X5EU!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 848w, https://substackcdn.com/image/fetch/$s_!X5EU!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!X5EU!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://bucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com/public/images/b2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":1857,"width":1125,"resizeWidth":409,"byte
