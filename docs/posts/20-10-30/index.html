                <article class="post"><p>之前这个博客叫“艮曰”，意思是记录王艮的话。可是“艮曰”和“子曰”太像了。曾经很尊重孔子，可是看了柏杨的「中国人史纲」，发现对儒家思想的信奉可能是今天中国如此落后的根源之一。</p><p>所以呢，为了跟孔子和儒家划清界限，批判的分析，我决定改变博客的标题。</p></article>
