                <h1>自然语言与编程语言</h1>
                <div class="meta"><span class="meta-date">2020-06-03</span><a class="source-link" href="https://yinwang1.substack.com/p/20-06-03" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>为什么最近提到这么多“自然语言”的问题呢？一会是英语，一会是中文。因为自然语言是与编程语言相通的。</p><p>一个程序员用什么样的语言，使用什么样的语言成分，如何组织他的程序，决定了他是什么样的程序员。</p><p>一个人用什么样的语言，什么样的词汇，用什么样的语调说话，也能决定他是什么样的人。</p><p>微妙的用词特征就能告诉你这是什么样的人，就像很小的程序细节就能告诉你这是什么样的程序员。</p><p>很多程序员看见什么“新式写法”就学什么，这跟很多人看到别人用什么词就用什么一样。结果就被传染了各种「语言的病毒」，逐渐迷失了自己。</p></article>
