                <h1>没了臭氧，天气就不热</h1>
                <div class="meta"><span class="meta-date">2023-07-21</span><a class="source-link" href="https://yinwang1.substack.com/p/9c6" target="_blank" rel="noopener noreferrer">原文链接</a></div>
