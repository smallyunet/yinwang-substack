                <h1>印象派和艺术的堕落</h1>
                <div class="meta"><span class="meta-date">2023-08-29</span><span class="tag tag-paid">PAID</span><a class="source-link" href="https://yinwang1.substack.com/p/f16" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>在 National Gallery 看了这么多的画之后，我发现我已经不是梵高的粉丝了。正好相反，我成了“梵高黑”，我也不再赞美“印象派”。我发现对比起 300-500 年前的精美作品（图 1，2，3，4），所谓“印象派”及其后人（比如莫奈，雷诺阿，梵高）只不过是没有完成的半成品而已（图 5，6，7）。</p><p>印象派之前的作品：</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!tdoO!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4813cf71-4447-4297-b819-7d2098bab9c9_480x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!tdoO!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4813cf71-4447-4297-b819-7d2098bab9c9_480x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!tdoO!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4813cf71-4447-4297-b819-7d2098bab9c9_480x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!tdoO!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4813cf71-4447-4297-b819-7d2098bab9c9_480x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!tdoO!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4813cf71-4447-4297-b819-7d2098bab9c9_480x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/4813cf71-4447-4297-b819-7d2098bab9c9_480x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":480,"resizeWidth":null,"bytes":156765,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offs
