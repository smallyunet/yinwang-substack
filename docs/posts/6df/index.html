se}' fetchpriority="high" height="326.6932422171602" src="../../assets/posts/6df/c51bd2050a0c2962.jpg" width="665"/></source></picture></div></a></figure></div><p>现在再看《扁鹊见蔡恒公》的故事，我越来越理解蔡桓公了。我自己没感觉有病，凭什么要相信你说我有病，吃你的药？历史上是否真有此事，蔡桓公是否真是那样死的，我觉得很值得怀疑。</p><p>是什么病可以发展那么快，从毫无感觉到病死，只花了一个月时间？这故事很可能是故意编造出来的。我觉得这篇文章大概是古代用来吓唬大家，推销医疗的一篇软文：不信医生你就死路一条，不要讳疾忌医，吃药吧！看来医学的这问题已经几千年了。</p><p></p></article>
