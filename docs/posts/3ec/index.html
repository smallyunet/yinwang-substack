                <h1>喷洒臭氧的效果</h1>
                <div class="meta"><span class="meta-date">2023-07-05</span><a class="source-link" href="https://yinwang1.substack.com/p/3ec" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>下面几幅图是中国，韩国，日本最近的臭氧浓度分布图。很明显，最近一旦看到尾迹飞机，臭氧浓度就升高，接着气温就升高。而且北方比南方喷洒密集，臭氧浓度高。这样造成的效果是，人们感觉怎么北方也这么热了，就以为全球真的变暖了。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!D4s3!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!D4s3!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!D4s3!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!D4s3!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!D4s3!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":334,"resizeWidth":null,"bytes":79869,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="640" src="../../asse
