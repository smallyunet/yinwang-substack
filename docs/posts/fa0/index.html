        <h1>逻辑是科学的基础</h1>
        <p class="subtitle">2022-11-21</p>
        <article class="post"><p>为什么我说逻辑非常的重要呢？因为很多人，包括很多科学家都不明白一些简单的逻辑原则，比如“没能证明一个东西存在”并不等于“这个东西不存在”。一个例子就是，Michelson-Morley 实验没能证明以太存在，并不等于以太就不存在。没能测出相对光速变化，并不等于相对光速就是不变的。当然，科学从未真正证明过病毒的存在，也不等于病毒就不存在。</p><p>逻辑是哲学的一部分，它是科学的基础。科学的研究和实验必须依据逻辑来进行，不然就可能是错误的。</p></article>
