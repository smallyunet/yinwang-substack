        <article class="post"><p>两本日语书看完了，日语老师也倒下几波了。上一个老师，因为不知道也不想解释 さよなら（撒哟那啦）里的 さよ（撒哟）和なら（那拉）分别是什么意思，连起来为什么就是“再见”的意思，放弃教我了。</p><p>韩语老师也因为我总是问“哈密达”和“斯密达”有什么不同，经常想哭。我还想起在 Indiana 大学选修数学系课程时，数学教授们面对我的问题的囧样 [坏笑]</p><p>要教这个人学外语（或者数学语言）是很辛苦的，因为他会把一切都拆开成最小的，可以用直觉和逻辑推导出来的元素，并且会质疑一切不合理的地方。</p></article>
