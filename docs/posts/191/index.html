                <h1>法国也有飞机尾迹</h1>

                <article class="post"><p>有朋友去法国，因为我之前跟她说了英国遭遇，于是跟我说法国好美啊，比英国好多了。我看了一下她发给我的视频，立即发现了天上有扩散的尾迹。最近在朋友圈看到的旅游照，发现各国的天空里都有这种尾迹。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!EYIw!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc380e7be-3a7b-4f5d-b5c9-18c0dd1932ea_368x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!EYIw!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc380e7be-3a7b-4f5d-b5c9-18c0dd1932ea_368x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!EYIw!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc380e7be-3a7b-4f5d-b5c9-18c0dd1932ea_368x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!EYIw!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc380e7be-3a7b-4f5d-b5c9-18c0dd1932ea_368x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!EYIw!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc380e7be-3a7b-4f5d-b5c9-18c0dd1932ea_368x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/c380e7be-3a7b-4f5d-b5c9-18c0dd1932ea_368x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":368,"resizeWidth":null,"bytes":92262,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="640" src="../../assets/posts/191/1ae1a052f1541bb2.jpg" width="368"/></source></picture></div></a></figure></div><p></p><p>很多人以为这么多国家都有，那说明这是正常现象。但我已经证明了，这些飞机都是 flightradar24 不是能查到的秘密飞机，我的望远镜也不会撒谎。遍及全世界，只能说明 Matrix 的势力遍及了全世界，操纵了所有国家的政府。这虽然让我心理稍微平衡了一些，但仍然为这个世界悲哀。</p><p></p></article>
