et":false}' fetchpriority="high" height="860" src="../../assets/posts/d5f/fba93e4a738a50e6.jpg" width="1456"/></source></picture></div></a></figure></div><p>地球上隔着那么多空气都可以看见灿烂的星空，在太空没有空气，为什么所有的“太空照片”里都看不到一颗星星？</p><p>如果疫情是真实的，为什么不能通过公开而科学的讨论，而要通过言论封锁的方式压制质疑的说法？况且这些质疑是来自专业的医生和科学家。</p><p>事实已经证明新冠疫苗对防止传播完全无效，为什么仍然在变相强制大家打疫苗？两针不够，还要第三针，第四针，为什么？</p><p>聪明的侦探不需要相信任何人的话，他并不能直接看见事实。他只是从各种现象的“逻辑不一致”中发现问题。其他人理解这些也不需要相信这个侦探，他们只需要看到这些逻辑不一致的地方。</p></article>
