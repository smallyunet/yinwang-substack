                <h1>珠穆朗玛峰上的星空</h1>
                <div class="meta"><span class="meta-date">2023-04-21</span><a class="source-link" href="https://yinwang1.substack.com/p/5f7" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>很多人轻易相信“科普”说太空中看不到也拍不到星星，也许是因为他们没见过地球上壮丽的星空是什么样的。这个珠穆朗玛峰上的星空延时摄影应该能告诉你，太空中由于光线没有大气的阻挡，星空应该比这还要壮观才对。</p><div class="youtube-wrap" data-attrs='{"videoId":"X1s3ngqYKTk","startTime":null,"endTime":null}' data-component-name="Youtube2ToDOM" id="youtube2-X1s3ngqYKTk"><div class="youtube-inner"><iframe allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" frameborder="0" gesture="media" height="409" loading="lazy" src="https://www.youtube-nocookie.com/embed/X1s3ngqYKTk?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" width="728"></iframe></div></div><p>像国际空间站这么现代的设施，上面有各种最高级的相机和巨大的镜头，各种配件设备，各种光线条件，没有任何理由拍不下太空中的星空。几十年了，却一张像样的星空照片和视频也没有拍过。这还不明显是假的吗？</p><p>所有的“太空计划”都是假的，主导“太空计划”的组织或个人，都是 Matrix 的高级成员。</p></article>
