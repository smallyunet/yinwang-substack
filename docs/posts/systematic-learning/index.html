        <h1>所谓系统学习</h1>
        <p class="subtitle">2020-08-25</p>
        <article class="post"><p>很多人以为学一门学问，非得看标准的课本，报班，进大学，才能进行“系统”的学习。然而我发现，「系统」这个概念是个思维陷阱，经常被作为智商税的诱饵。</p><p>我是一个真的追求并且明白系统是什么的人。在我看来，很多大学里学的课程，教科书的组织，内容的传授方式，其实并不系统。</p><p>以为它们是系统的，放弃自己的判断，盲目跟着别人的指挥棒，结果就拖很久也学不好东西。</p><p>世界上的人花了太多时间来学习，事倍功半，其中一个原因就是对「系统」的理解偏差。</p></article>
