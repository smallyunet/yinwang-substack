                <h1>光速并不是不变的</h1>
                <div class="meta"><span class="meta-date">2022-09-21</span><a class="source-link" href="https://yinwang1.substack.com/p/c52" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>就像我去年发现的一样，“光速不变”并不是事实，Michelson-Morley 实验是不可靠的，甚至可以说是不科学的。在地球表面上特定的地方，用很复杂的装置，非常特殊的人造条件下，用很间接的方式，证明光速在各个方向都是一样的，这如何能证明“光速不变”在整个宇宙中，在任何时候都成立？初级错误。</p><p>在这个演讲中，Alexander Unzicker 指出爱因斯坦在很早的时候可能就已经知道光速并不是恒定的，可是他那时候“太忙了”…… 多么完美的理由。</p><div class="youtube-wrap" data-attrs='{"videoId":"o67TNtgPPck","startTime":null,"endTime":null}' data-component-name="Youtube2ToDOM" id="youtube2-o67TNtgPPck"><div class="youtube-inner"><iframe allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" frameborder="0" gesture="media" height="409" loading="lazy" src="https://www.youtube-nocookie.com/embed/o67TNtgPPck?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" width="728"></iframe></div></div><p>有时候我们以为科学家的这些行为是正常的“错误”，而没有想到他们可能是“故意”为之。</p></article>
