                <h1>地球上的普通人拍的星空照片</h1>
                <div class="meta"><span class="meta-date">2023-08-17</span><span class="tag tag-paid">PAID</span><a class="source-link" href="https://yinwang1.substack.com/p/c10" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>分享一张国内的朋友（不是专业摄影师）前几天拍到的星空照片。注意到地平线上的亮光（车灯）了吗？它很亮，却仍然能拍到很多的星星，几乎无所不在。除了被云挡住的位置，很难找到没有星星的角度。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!YAqW!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F92d4a3f6-4842-43fa-a12d-1e220113fb75_5935x3957.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!YAqW!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F92d4a3f6-4842-43fa-a12d-1e220113fb75_5935x3957.jpeg 424w, https://substackcdn.com/image/fetch/$s_!YAqW!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F92d4a3f6-4842-43fa-a12d-1e220113fb75_5935x3957.jpeg 848w, https://substackcdn.com/image/fetch/$s_!YAqW!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F92d4a3f6-4842-43fa-a12d-1e220113fb75_5935x3957.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!YAqW!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F92d4a3f6-4842-43fa-a12d-1e220113fb75_5935x3957.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/92d4a3f6-4842-43fa-a12d-1e220113fb75_5935x3957.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":971,"width":1456,"resizeWidth":null,"bytes":3885689,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="971" src="../../assets/posts/c10/8f03a9a4cdcd1e5a.jpg" width="1456"/></source></picture></div></a></figure></div><p>有些人喜欢说需要“长曝光”才能拍到这的场面，这照片用的确实是相机长曝光（25 s）。我估计当时星光不是很明显，因为光污染和空气阻挡，所以需要加长曝光。在英国，我有时候可以用手机，不用长曝光，随手一拍就拍出这样的星空。</p></article>
