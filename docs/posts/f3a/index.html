                <h1>“台风云”是什么</h1>

                <article class="post"><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!Q5xI!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6441f87c-f596-460b-b904-eea1aa97ec47_1109x1479.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!Q5xI!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6441f87c-f596-460b-b904-eea1aa97ec47_1109x1479.jpeg 424w, https://substackcdn.com/image/fetch/$s_!Q5xI!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6441f87c-f596-460b-b904-eea1aa97ec47_1109x1479.jpeg 848w, https://substackcdn.com/image/fetch/$s_!Q5xI!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6441f87c-f596-460b-b904-eea1aa97ec47_1109x1479.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!Q5xI!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6441f87c-f596-460b-b904-eea1aa97ec47_1109x1479.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/6441f87c-f596-460b-b904-eea1aa97ec47_1109x1479.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":1479,"width":1109,"resizeWidth":null,"bytes":239982,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="1479" src="../../assets/posts/f3a/155366c1c50aa9f7.jpg" width="1109"/></source></picture></div></a></figure></div><p>这张照
