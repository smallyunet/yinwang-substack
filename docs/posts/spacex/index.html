                <article class="post"><p>SpaceX，3 天前的“Starlink 卫星”发射：</p><div class="youtube-wrap" data-attrs='{"videoId":"NONM-xsKMSs","startTime":null,"endTime":null}' data-component-name="Youtube2ToDOM" id="youtube2-NONM-xsKMSs"><div class="youtube-inner"><iframe allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" frameborder="0" gesture="media" height="409" loading="lazy" src="https://www.youtube-nocookie.com/embed/NONM-xsKMSs?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" width="728"></iframe></div></div><p><br/>你看到了星星吗？没有大气的太空里，难道可以一颗星星也看不到，一片漆黑？去看看 SpaceX 所有的发射视频（youtube.com/c/SpaceX），总共能看到几颗星星？</p><p><br/>在你们家垃圾桶上扎个垃圾袋，旁边风扇吹着，拉上窗帘，就能拍出这样的视频了。总有人相信这些垃圾袋和铝箔纸包起来的东西能上太空，有什么办法？</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!NLuI!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F42375257-83a2-4a93-959c-6e5ac225f2b9_1642x1047.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!NLuI!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F42375257-83a2-4a93-959c-6e5ac225f2b9_1642x1047.jpeg 424w, https://substackcdn.com/image/fetch/$s_!NLuI!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F42375257-83a2-4a93-959c-6e5ac225f2b9_1642x1047.jpeg 848w, https://substackcdn.com/image/fetch/$s_!NLuI!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F42375257-83a2-4a93-959c-6e5ac225f2b9_1642x1047.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!NLuI!,w_1456,c_lim
