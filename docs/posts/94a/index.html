                <article class="post"><p>在显微镜下，做了两次双氧水杀真菌的实验。因为脚上没找到真菌，用的是卫生间里的霉点。效果看着比较有意思，放大倍数只用了 100 倍。基本几分钟之内就结束战斗了，跟泡脚时观察到的情况类似，所以一次 10 分钟大概足够了。<br/><br/>我注意到，杀菌产生的气泡似乎会阻碍双氧水接触到附近的其它真菌。要等前面的气泡破了之后，才会有新的接触，产生新的气泡。所以泡脚时可能应该多活动脚趾，帮助气泡跑掉。这样就能更迅速地进行进一步的杀菌工作。</p></article>
