                <h1>“沙尘暴”没有沙子</h1>
                <div class="meta"><span class="meta-date">2023-05-21</span><a class="source-link" href="https://yinwang1.substack.com/p/c81" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>有人跟我说北京又来“沙尘暴”了，但却看不到沙子，只有漫天的严重“雾霾”。上一次持续几天的严重“沙尘暴”，也只有一天出现了沙子，但是就在那天，天上也出现了尾迹飞机。这说明什么呢？自己去想想吧。</p><p>他说很少有人能理解这个事，我觉得这无所谓。也许 Matrix 就是想惩罚那些崇拜权威，没有思维能力的人吧。目前我看到被整得最惨的，都是那些迷信权威，自以为是的人。很多这些人以前都很瞧不起我。有时候我觉得应该感谢Matrix，顺便帮我惩罚了他们。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!n28e!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdff5a32a-4314-4ca2-827e-6ed633ce2222_1260x668.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!n28e!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdff5a32a-4314-4ca2-827e-6ed633ce2222_1260x668.jpeg 424w, https://substackcdn.com/image/fetch/$s_!n28e!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdff5a32a-4314-4ca2-827e-6ed633ce2222_1260x668.jpeg 848w, https://substackcdn.com/image/fetch/$s_!n28e!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdff5a32a-4314-4ca2-827e-6ed633ce2222_1260x668.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!n28e!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdff5a32a-4314-4ca2-827e-6ed633ce2222_1260x668.jpeg 1456w" type="image/webp"><img alt="IMG_0656.jpeg" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/dff5a32a-4314-4ca2-827e-6ed633ce2222_1260x668.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":668,"width":1260,"resizeWidth":null,"bytes":null,"alt":"IMG_0656.jpeg","title":null,"type":null,"href":null,"belowTheFold":false,"t
