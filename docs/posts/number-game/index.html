        <article class="post"><p>做学生的时候，我们被训练成为追求考试分数的机器，然而分数却不能衡量知识的绝对值。分数只能表达相对值，只能用于竞争。逐渐，分数失去了意义，因为已经没有人拥有真实的知识。</p><p>工作之后，我们被压迫成为追求金钱的机器，然而金钱却不能衡量生活水平的绝对值。金钱只能表达相对值，只能用于交换。逐渐，金钱失去了意义，因为已经没有人创造真实的财富。</p><p>大部分人的一生，只是一场虚无的数字游戏。</p></article>
