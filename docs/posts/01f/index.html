                <h1>天文望远镜测评</h1>

                <article class="post"><p>看了一个天文望远镜测评，对比 $130, $600, $1750 三个价位的天文望远镜。</p><div class="youtube-wrap" data-attrs='{"videoId":"lsS6PrrWnhI","startTime":null,"endTime":null}' data-component-name="Youtube2ToDOM" id="youtube2-lsS6PrrWnhI"><div class="youtube-inner"><iframe allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" frameborder="0" gesture="media" height="409" loading="lazy" src="https://www.youtube-nocookie.com/embed/lsS6PrrWnhI?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" width="728"></iframe></div></div><p>看起来都是很普通的望远镜，比前几天推荐的看“国际空间站”用的那种小太多了。</p><div class="youtube-wrap" data-attrs='{"videoId":"0yuQOO2jA1I","startTime":null,"endTime":null}' data-component-name="Youtube2ToDOM" id="youtube2-0yuQOO2jA1I"><div class="youtube-inner"><iframe allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" frameborder="0" gesture="media" height="409" loading="lazy" src="https://www.youtube-nocookie.com/embed/0yuQOO2jA1I?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" width="728"></iframe></div></div><p>然而就算是最便宜那个望远镜拍下来的照片，对比“太空“拍的那些照片也是天壤之别。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!GZds!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F41926b9e-8d02-4029-b600-c16a2995753d_2388x1582.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!GZds!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F41926b9e-8d02-4029-b600-c16a2995753d_2388x1582.jpeg 424w, https://substackcdn.com/image/fetch/$s_!GZds!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws
