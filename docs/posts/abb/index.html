                <h1>天气为什么这么热</h1>
                <div class="meta"><span class="meta-date">2023-06-11</span><a class="source-link" href="https://yinwang1.substack.com/p/abb" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>1. 今天伦敦气温达到了罕见的 30 度。</p><p>2. 傍晚出现大量尾迹飞机。</p><p>3.「在意空气」显示 O3 浓度达到 138（中度污染），部分地区为“空气污染高”。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!WsS3!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F51a5bbc9-364a-44eb-a42d-d3e53b690c42_315x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!WsS3!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F51a5bbc9-364a-44eb-a42d-d3e53b690c42_315x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!WsS3!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F51a5bbc9-364a-44eb-a42d-d3e53b690c42_315x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!WsS3!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F51a5bbc9-364a-44eb-a42d-d3e53b690c42_315x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!WsS3!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F51a5bbc9-364a-44eb-a42d-d3e53b690c42_315x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/51a5bbc9-364a-44eb-a42d-d3e53b690c42_315x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":315,"resizeWidth":null,"bytes":61751,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" height="640" src="../../assets/posts/abb/7078c34ef7b9c4e9.jpg" width="315"/></source></picture></div></a></figure></div><p></p><p>4. iPhone 的“天气app”也显示“中度污染”，主要污染物为 O3。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!qoAP!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F911af803-1d4f-43de-b66d-713d04ed1403_583x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!qoAP!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F911af803-1d4f-43de-b66d-713d04ed1403_583x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!qoAP!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F911af803-1d4f-43de-b66d-713d04ed1403_583x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!qoAP!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F911af803-1d4f-43de-b66d-713d04ed1403_583x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!qoAP!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F911af803-1d4f-43de-b66d-713d04ed1403_583x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/911af803-1d4f-43de-b66d-713d04ed1403_583x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":583,"resizeWidth":null,"bytes":60995,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":false,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' height="640" src="../../assets/posts/abb/047fdd476015607a.jpg" width="583"/></source></picture></div></a></figure></div><p></p><p>5. 半夜室外气温还有 19 C，室内气温高达 28 C。英国的房子大部分没有空调。</p><p>6. O3 是比 CO2 保温能力强 1000 倍的温室气体。</p><p>7. 几天前，成都发布了“臭氧重污染天气黄色预警”。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!VnJb!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fed753f4d-da3a-4394-8ac0-6039d5054b3c_334x640.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!VnJb!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fed753f4d-da3a-4394-8ac0-6039d5054b3c_334x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!VnJb!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fed753f4d-da3a-4394-8ac0-6039d5054b3c_334x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!VnJb!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fed753f4d-da3a-4394-8ac0-6039d5054b3c_334x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!VnJb!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fed753f4d-da3a-4394-8ac0-6039d5054b3c_334x640.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/ed753f4d-da3a-4394-8ac0-6039d5054b3c_334x640.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":640,"width":334,"resizeWidth":null,"bytes":70751,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":true,"topImage":false,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' height="640" src="../../assets/posts/abb/e02190a5a738a0ac.jpg" width="334"/></source></picture></div></a></figure></div><p></p><p>根据以上线索，你说这是什么戏？</p><p></p></article>
