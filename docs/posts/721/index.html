/source></picture></div></a></figure></div><p>我为什么知道可以用柠檬除水锈？有谁知道柠檬汁的 PH 值？加一杯水之后会怎么样？柠檬汁和橙汁的 PH 有多大差别？这些都是科学，可是有谁观察过？他们只相信各种化学清洁剂包装上写的“特效除水锈”，买回来却不管用，想不到事情可以如此简单。</p></article>
