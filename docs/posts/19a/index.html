                <h1>航天骗局利用了“国家荣誉感”</h1>
                <div class="meta"><span class="meta-date">2023-07-11</span><a class="source-link" href="https://yinwang1.substack.com/p/19a" target="_blank" rel="noopener noreferrer">原文链接</a></div>
                <article class="post"><p>Matrix 就是利用了人类的这种攀比心理，把“航天工程”和“国家荣誉感”挂钩。让大家去“爱国”，去争谁的“国家”是最厉害的，最后却没发现所有国家的所有火箭都是假的，它们从未去过太空，而是直接栽进了海里。所谓的“航天事业”不过是 Matrix 的“国库提款机”而已。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" data-component-name="Image2ToDOM" href="https://substackcdn.com/image/fetch/$s_!uYcf!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5983f488-c180-4513-b1c1-7a4614e24294_877x903.jpeg" target="_blank"><div class="image2-inset"><picture><source sizes="100vw" srcset="https://substackcdn.com/image/fetch/$s_!uYcf!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5983f488-c180-4513-b1c1-7a4614e24294_877x903.jpeg 424w, https://substackcdn.com/image/fetch/$s_!uYcf!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5983f488-c180-4513-b1c1-7a4614e24294_877x903.jpeg 848w, https://substackcdn.com/image/fetch/$s_!uYcf!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5983f488-c180-4513-b1c1-7a4614e24294_877x903.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!uYcf!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5983f488-c180-4513-b1c1-7a4614e24294_877x903.jpeg 1456w" type="image/webp"><img alt="" class="sizing-normal" data-attrs='{"src":"https://substack-post-media.s3.amazonaws.com/public/images/5983f488-c180-4513-b1c1-7a4614e24294_877x903.jpeg","srcNoWatermark":null,"fullscreen":null,"imageSize":null,"height":903,"width":877,"resizeWidth":null,"bytes":186795,"alt":null,"title":null,"type":"image/jpeg","href":null,"belowTheFold":false,"topImage":true,"internalRedirect":null,"isProcessing":false,"align":null,"offset":false}' fetchpriority="high" he
