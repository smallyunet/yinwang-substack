<p>听说北京很多人“中招”了。我看了一下空气质量历史记录，发现 12 月 12 日，北京空气 pm2.5 和 pm10 的浓度极高。pm2.5 超过了 160，pm10 超过了 1000！前所未见的高度，柱状图都爆表了，只看到一条条的黑线。而且从幅度上看，是在短时间内急剧上升的。很多人担心病毒“传染”，却没注意到空气里的有毒物质可能才是“共同起因”。我的建议是：出门戴上 N95 口罩，在家密封好门窗。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/$s_!X5EU!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!X5EU!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 424w, https://substackcdn.com/image/fetch/$s_!X5EU!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 848w, https://substackcdn.com/image/fetch/$s_!X5EU!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!X5EU!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!X5EU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fb2506549-31c7-4c57-8896-3c105f17e5f9_1125x1857.jpeg" width="409" height="675.1226666666
