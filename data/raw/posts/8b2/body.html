<p>根据之前分析的相机光学原理，我们可以简单分析一下这个“第一次哈勃维修计划”视频。其他的三次“哈勃维修计划”视频也是同样的特征，所有其它的“太空计划”视频也都是这样的。这里我只剪辑了比较短的一段“实拍镜头”，分析里面的黑色天空和“暗部”的细节。</p><div id="youtube2-whwDK2gu2Pc" class="youtube-wrap" data-attrs="{&quot;videoId&quot;:&quot;whwDK2gu2Pc&quot;,&quot;startTime&quot;:null,&quot;endTime&quot;:null}" data-component-name="Youtube2ToDOM"><div class="youtube-inner"><iframe src="https://www.youtube-nocookie.com/embed/whwDK2gu2Pc?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" frameborder="0" loading="lazy" gesture="media" allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" width="728" height="409"></iframe></div></div><p>注意，这些镜头里很多都没有太阳，也没有特别亮的反光。大家可以明显地看到，当大片天空全黑，看不到一颗星星的时候，望远镜的暗部细节却是拍得清楚的。这不符合相机的光学原理。因为星星是光源，它们是比“暗部”更亮的位置。同样低的曝光，不可能把暗部拍清楚了，却完全拍不到星星（光源）。连一个模糊的亮点都没有留下，这是不可能的。</p><p></p>
