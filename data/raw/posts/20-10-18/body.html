<p>外面的日语班跟我说，他们的班分了 12 级，我要学到 7，8 级，花几万学费，才能勉强开始看日语小说。真不知要拖到什么时候，甚至可能根本就无效。</p><p>结果自己动手，没花一分钱学费，不到两个月的努力，已经可以开始看小说，揣摩作者的手法了。</p><p>每一门外语都是一扇新的窗户，它让外面的阳光可以照射进来。</p><a class="image-link image2" target="_blank" href="https://substackcdn.com/image/fetch/$s_!Z3CU!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb359d59-f521-4a47-8636-4cd71a1e6691_3801x2851.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Z3CU!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb359d59-f521-4a47-8636-4cd71a1e6691_3801x2851.jpeg 424w, https://substackcdn.com/image/fetch/$s_!Z3CU!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb359d59-f521-4a47-8636-4cd71a1e6691_3801x2851.jpeg 848w, https://substackcdn.com/image/fetch/$s_!Z3CU!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb359d59-f521-4a47-8636-4cd71a1e6691_3801x2851.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!Z3CU!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb359d59-f521-4a47-8636-4cd71a1e6691_3801x2851.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Z3CU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb359d59-f521-4a47-8636-4cd71a1e6691_3801x2851.jpeg" data-attrs="{&quot;src&quot;:&quot;https://bucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com/public/images/bb359d59-f521-4a47-8
