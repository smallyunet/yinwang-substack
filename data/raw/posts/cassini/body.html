<p>由于在网上搜索实拍的土星照片，引发了其它的探索。又找到了这个介绍“Cassini 土星探测器”的视频。</p><div id="youtube2-tyMbktsAScE" class="youtube-wrap" data-attrs="{&quot;videoId&quot;:&quot;tyMbktsAScE&quot;,&quot;startTime&quot;:null,&quot;endTime&quot;:null}" data-component-name="Youtube2ToDOM"><div class="youtube-inner"><iframe src="https://www.youtube-nocookie.com/embed/tyMbktsAScE?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" frameborder="0" loading="lazy" gesture="media" allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" width="728" height="409"></iframe></div></div><p>说这个探测器进入了土星的轨道，围绕着土星观测了 13 年之久（2004-2017），采集了 635GB 的数据。然而整个视频里，却只看到两张假得不行的电脑合成图片。13 年，635GB 的数据在哪里？</p><p>计算机图形学的第一课，可能就是讲如何用最初级的方法 3D 渲染出这样很假的图片出来，然后就会开始讲如何用更高级的做法，渲染出更逼真的图片。然而这最初级的渲染图片，却被堂而皇之地被 NASA 用作了土星的“实拍”照片。第三张图片也是“实拍”照片，但是你看它像是真的吗？看看背景里纯黑的天空。</p><p></p>
