<p>新年快乐？过年好？提醒大家，雾霾似乎是不过春节，不放假的，而且异常的厉害。大年三十的半夜，为什么还有这么严重的雾霾，而且浓度超过平时好几倍？这是哪里的工人，大年三十还在赶工？这不是很明显了吗？雾霾并不是工厂排放的污染，而是故意放毒。要是你病了，他们就说你是过年期间到热闹的地方被人传染的。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/$s_!JsvA!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!JsvA!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg 424w, https://substackcdn.com/image/fetch/$s_!JsvA!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg 848w, https://substackcdn.com/image/fetch/$s_!JsvA!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!JsvA!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!JsvA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg" width="465" height="478.0709768095573" data-attrs="{&quot;src&quot;:&quot;https://substack-post-media.s3.amazonaws.com/public/images/0b05c0de-9973-4ccf-b8fb-ceab7a402dc5_1423x1463.jpeg&quot;,&quot;srcNoWatermark&quot;:null,&quot;fullscreen&quot;:null,&q
