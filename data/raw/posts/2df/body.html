1165 11.3235L6.38224 13.0882"></path></g></svg></button><button tabindex="0" type="button" class="pencraft pc-reset pencraft icon-container view-image"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-maximize2 lucide-maximize-2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" x2="14" y1="3" y2="10"></line><line x1="3" x2="10" y1="21" y2="14"></line></svg></button></div></div></div></a></figure></div><p>今天从超市买了一瓶蜂蜜，发现标签上写着：蜂蜜不应该给 12 个月以下的婴儿吃。（图 1）</p><p>因为我不是婴儿，我也没有婴儿，所以开头我没多想。但是过了一会，我开始琢磨这个事。因为我知道蜂蜜是好东西，但为什么标签说不能给婴儿吃蜂蜜呢？于是我用“why babies can't have honey”这个标题搜了一下网络，发现好多文章，甚至包括<a href="https://www.britannica.com/story/why-shouldnt-babies-eat-honey">大英百科全书</a>，都说蜂蜜里面可能有一种叫做 Clostridium 的细菌，会导致 infant botulism（婴儿肉毒症）。（图 2）</p>
