<p>NASA 使用自己的权威，使用一系列很假的“太空图片”，成功地颠倒了人们的认知。对于“太空图片”，很多人都认为——凡是看上去真的都是假的（电影），要看上去假的才是真的（新闻）。而其实都是假的。</p><p>人们被这样洗脑之后，就可以非常节省成本地制造各种“太空计划”了。买点便宜板材，胶布，垃圾袋，铝箔纸，很快就能拼出一个“太空飞行器”来，照片也可以雇佣最初级的美工来做，然后人们还以为是真的——因为它们看上去是假的。</p><p>为什么总有科学家说“科学与宗教不矛盾”呢？因为所谓的“科学”本身就是一种宗教，是统治者用来制造骗局，控制人们头脑的工具，所以科学当然跟宗教不矛盾了。</p><p></p>
