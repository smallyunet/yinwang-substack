<p>下面几幅图是中国，韩国，日本最近的臭氧浓度分布图。很明显，最近一旦看到尾迹飞机，臭氧浓度就升高，接着气温就升高。而且北方比南方喷洒密集，臭氧浓度高。这样造成的效果是，人们感觉怎么北方也这么热了，就以为全球真的变暖了。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/$s_!D4s3!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!D4s3!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 424w, https://substackcdn.com/image/fetch/$s_!D4s3!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 848w, https://substackcdn.com/image/fetch/$s_!D4s3!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!D4s3!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!D4s3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg" width="334" height="640" data-attrs="{&quot;src&quot;:&quot;https://substack-post-media.s3.amazonaws.com/public/images/5f45a336-c476-4f4a-a964-5ec2156f44b6_334x640.jpeg&quot;,&quot;srcNoWatermark&quot;:null,&quot;fullscreen&quot;:null,&quot;imageSize&quot;:null,&quot;height&quot;:640,&quot;width&quot
