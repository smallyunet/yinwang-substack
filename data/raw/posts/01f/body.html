<p>看了一个天文望远镜测评，对比 $130, $600, $1750 三个价位的天文望远镜。</p><div id="youtube2-lsS6PrrWnhI" class="youtube-wrap" data-attrs="{&quot;videoId&quot;:&quot;lsS6PrrWnhI&quot;,&quot;startTime&quot;:null,&quot;endTime&quot;:null}" data-component-name="Youtube2ToDOM"><div class="youtube-inner"><iframe src="https://www.youtube-nocookie.com/embed/lsS6PrrWnhI?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" frameborder="0" loading="lazy" gesture="media" allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" width="728" height="409"></iframe></div></div><p>看起来都是很普通的望远镜，比前几天推荐的看“国际空间站”用的那种小太多了。</p><div id="youtube2-0yuQOO2jA1I" class="youtube-wrap" data-attrs="{&quot;videoId&quot;:&quot;0yuQOO2jA1I&quot;,&quot;startTime&quot;:null,&quot;endTime&quot;:null}" data-component-name="Youtube2ToDOM"><div class="youtube-inner"><iframe src="https://www.youtube-nocookie.com/embed/0yuQOO2jA1I?rel=0&amp;autoplay=0&amp;showinfo=0&amp;enablejsapi=0" frameborder="0" loading="lazy" gesture="media" allow="autoplay; fullscreen" allowautoplay="true" allowfullscreen="true" width="728" height="409"></iframe></div></div><p>然而就算是最便宜那个望远镜拍下来的照片，对比“太空“拍的那些照片也是天壤之别。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/$s_!GZds!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F41926b9e-8d02-4029-b600-c16a2995753d_2388x1582.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!GZds!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F41926b9e-8d02-4029-b600-c16a2995753d_2388x1582.jpeg 424w, https://substackcdn.com/image/fetch/$s_!GZds!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05
