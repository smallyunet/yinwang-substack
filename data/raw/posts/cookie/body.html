<p>现在是西班牙产橙子的季节吗？如果你想知道，去搜索一下。对不起，点开的每一个不知是否有价值看的网站，都要先给你一个“cookie 同意书”，不点就不让你看。说得很好听：</p><blockquote><p>为了给您提供更“个性化”的体验，我们和 <strong>218 个伙伴</strong>使用各种技术（例如 cookie）来存储和访问信息。</p></blockquote><p>仔细想想：218 个伙伴，这是什么级别的信息跟踪？</p><p>本来只打算几秒钟瞄一下，一掠而过的网页，结果你还得花更多的时间找到它们的“Reject”按钮在哪里。通常说来“Accept”的按钮都在最面上，所以一般人为了省事，不假思索就点了“Accept”。</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/$s_!Pb7U!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa53967b4-7ab3-47bb-9d0a-48403955926c_2388x1620.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Pb7U!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa53967b4-7ab3-47bb-9d0a-48403955926c_2388x1620.jpeg 424w, https://substackcdn.com/image/fetch/$s_!Pb7U!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa53967b4-7ab3-47bb-9d0a-48403955926c_2388x1620.jpeg 848w, https://substackcdn.com/image/fetch/$s_!Pb7U!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa53967b4-7ab3-47bb-9d0a-48403955926c_2388x1620.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!Pb7U!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa53967b4-7ab3-47bb-9d0a-48403955926c_2388x1620.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Pb7U!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa53967b4-7ab3-47bb-9d0a-48403955926c_2388x1620.jpeg" width="1456" height="988" data-attrs="{&quot;src&quot;:&quot;https://substac
